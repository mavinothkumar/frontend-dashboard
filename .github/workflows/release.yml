name: Build & Release Package

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+*'
  workflow_dispatch:

jobs:
  build:
    name: Package Production Plugin ZIP
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies & Build Production Assets
        run: |
          npm ci
          npm run build

      - name: Create Production ZIP (Honoring .gitattributes)
        run: |
          PLUGIN_SLUG="frontend-dashboard"
          mkdir -p /tmp/package/${PLUGIN_SLUG}
          
          # Use git archive to respect .gitattributes export-ignore
          git archive HEAD | tar -x -C /tmp/package/${PLUGIN_SLUG}
          
          # Copy freshly compiled production assets into package
          if [ -d "assets/dist" ]; then
            mkdir -p /tmp/package/${PLUGIN_SLUG}/assets/dist
            cp -r assets/dist/* /tmp/package/${PLUGIN_SLUG}/assets/dist/
          fi
          
          cd /tmp/package
          zip -r "${GITHUB_WORKSPACE}/${PLUGIN_SLUG}.zip" "${PLUGIN_SLUG}"

      - name: Create GitHub Release & Upload Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: frontend-dashboard.zip
          draft: false
          prerelease: false
          generate_release_notes: true
